[package]
name = "oc-workbench-shell"
version = "1.20.0"
edition = "2021"
description = "OpenCode 工作台桌面外壳（tao + wry / WebView2）"
publish = false

[[bin]]
name = "oc-workbench-shell"
path = "src/main.rs"

[dependencies]
tao = "0.37"
wry = "0.57"
# preserve_order：保存 opencode.json 时按文件里原有顺序写回，
# 否则 BTreeMap 会把顶层键全部按字母序重排，git diff 看着像改了一大片。
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["native-tls", "json", "socks-proxy"] }
# ureq 的 native-tls feature 只提供「impl TlsConnector」，不会自动装进 Agent——
# 不显式传 connector 时 HTTPS 会直接报 "no TLS backend is configured"。
# 显式用 Windows 证书库（schannel），比内置 webpki 根证书更适配企业代理。
native-tls = "0.2"
include_dir = "0.7"
rfd = "0.15"
open = "5"
getrandom = "0.2"
# 一键登录要构造 Basic 头。Cargo.lock 里本来就有 0.22.1（ureq 的传递依赖，已在编译图里），
# 显式声明只是把「能用」写进契约，不会多引一个 crate、也不会多编译一次。
base64 = "0.22"
# 校验更新包：Cargo.lock 里本来就有 0.10.9（ureq 的传递依赖），不新增编译图
sha2 = "0.10"
# 读 opencode 的会话库（SQLite）：用量页要合并「本地会话」的调用，
# 光读 magpie 的 usage.jsonl 会漏掉不走网关的请求。bundled 自带 SQLite，
# 不依赖系统里的 sqlite3.dll。
rusqlite = { version = "0.32", features = ["bundled"] }

# 依赖一次性编译好，debug 也能秒开窗口
[profile.dev.package."*"]
opt-level = 1
