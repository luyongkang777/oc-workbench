name: ci

# 每次 push / PR 都跑：前端类型检查 + 单测，网关 vet + 单测 + 交叉编译。
# release.yml 只负责打 tag 发版，日常回归看这个。

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    # 单测里有按 process.platform 分支的逻辑，和 release 保持一致用 Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 前端单测
        run: npm test

      # 验收 #11 要求 npm run build 全绿；只跑单测发现不了构建期错误。
      - name: 构建前端产物
        run: npm run build

  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: remote-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # 零依赖项目没有 go.sum，setup-go 会报 Restore cache failed
          cache: false

      - name: go vet
        run: go vet ./...

      - name: 网关单测
        run: go test ./... -count=1

      # 部署用的是 Linux 二进制，这里顺带确认交叉编译没坏
      - name: 交叉编译（linux/amd64）
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o /tmp/ocw-gateway .
          ls -l /tmp/ocw-gateway

  shell:
    # 外壳是约 1700 行新增 Rust，之前 CI 完全没有覆盖。
    # build.rs 会把 dist 嵌进二进制，所以必须先出前端产物才能编译/测试。
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell

      - name: 安装依赖
        run: npm ci

      - name: 构建前端产物（build.rs 需要）
        run: npm run build

      - name: 外壳单测
        working-directory: shell
        run: cargo test
